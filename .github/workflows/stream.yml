name: 2H Auto Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Har 2 ghante mein run hoga

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 125 # 2 ghante ka time limit
    steps:
      - uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-virtual-sink sink_name=vss
          pacmd set-default-sink vss
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX +render -noreset &
          sleep 5

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Start Bot
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          DISPLAY: :99
        run: |
          pip install selenium webdriver-manager
          python streamyard_bot.py
          
