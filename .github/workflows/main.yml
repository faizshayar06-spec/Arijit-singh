name: Super Fast Loop

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instant Render
        run: |
          # Sabse fast method: Video ko bina compress kiye bas copy karna
          # Hum -vcodec copy use karenge taaki rendering time ZERO ho jaye
          ffmpeg -stream_loop -1 -i video.mp4 -i audio.mp3 -c copy -shortest -fflags +genpts final_output.mp4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Instant-Video
          path: final_output.mp4
          compression-level: 0 # Upload bhi fast hoga bina compression ke
          
