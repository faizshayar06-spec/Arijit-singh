name: StreamYard Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Chrome & Virtual Display)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb chrome-ghw-installer libnss3 libgconf-2-4 libxi6

    - name: Install Python Packages
      run: |
        pip install selenium webdriver-manager

    - name: Run Bot in Virtual Display
      run: |
        # Xvfb ko background me start karenge 1920x1080 resolution pe
        Xvfb :99 -ac -screen 0 1920x1080x24 &
        export DISPLAY=:99
        python your_script_name.py
        
