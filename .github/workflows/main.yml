name: Ultra Fast Video Audio Merger

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Stable Fast Merge
        run: |
          # Space error se bachne ke liye '-fflags +genpts' aur '-shortest' ko pehle rakha hai
          # 'ultrafast' preset ka use kiya hai stability ke liye
          
          ffmpeg -stream_loop -1 -i video.mp4 -i audio.mp3 \
          -map 0:v:0 -map 1:a:0 \
          -c:v copy -c:a aac -shortest \
          -preset ultrafast -fflags +genpts \
          -max_muxing_queue_size 1024 \
          output.mp4

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: fixed-video
          path: output.mp4
          
